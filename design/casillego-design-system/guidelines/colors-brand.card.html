<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px}
.sw{flex:1;height:56px;border-radius:10px;display:flex;align-items:flex-end;padding:8px 10px;font-size:11px;font-weight:700;color:#fff;font-family:var(--font-mono)}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--brand)">brand #FB6A45</div>
    <div class="sw" style="background:var(--brand-strong)">brand-strong #B4472C</div>
    <div class="sw" style="background:var(--brand-soft);color:var(--brand-strong)">brand-soft 12%</div>
  </div>
  <div class="row">
    <div class="sw" style="background:var(--ink-900)">ink-900</div>
    <div class="sw" style="background:var(--ink-700)">ink-700</div>
    <div class="sw" style="background:var(--ink-500)">ink-500</div>
    <div class="sw" style="background:var(--ink-300);color:#12273A">ink-300</div>
    <div class="sw" style="background:var(--ink-100);color:#12273A">ink-100</div>
  </div>
</body></html>

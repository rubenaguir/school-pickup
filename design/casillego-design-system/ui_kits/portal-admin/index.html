                          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V8l7-4 7 4v13" /><path d="M9 21v-5h6v5" /></svg>
                        </span>
                        <span style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                          <span style={{ fontSize: 17, fontWeight: 700, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>{r.name}</span>
                          <span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500 }}>{r.type} · {r.zona}</span>
                          <span style={{ fontSize: 12, color: 'var(--ink-200)', fontFamily: 'var(--font-mono)', letterSpacing: '.03em', marginTop: 2 }}>RFC {r.rfc}</span>
                        </span>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 3, borderLeft: '1px solid var(--border-hairline-2)', paddingLeft: 24 }}>
                        <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)' }}>Responsable</span>
                        <span style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink-700)' }}>{r.responsable}</span>
                        <span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500 }}>{r.correo}</span>
                        <span style={{ fontSize: 12, color: 'var(--ink-200)' }}>Solicitó {r.when}</span>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'flex-end' }}>
                        {!resolved ? (
                          <>
                            <span style={{ display: 'inline-flex', alignItems: 'center', padding: '10px 14px', borderRadius: 11, border: '1px solid var(--border-strong)', color: 'var(--ink-300)', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Ver expediente</span>
                            <span onClick={() => setResolutions((s) => ({ ...s, [r.id]: 'rejected' }))} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '10px 16px', borderRadius: 11, border: '1px solid var(--danger-border)', color: 'var(--danger)', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Rechazar</span>
                            <span onClick={() => setResolutions((s) => ({ ...s, [r.id]: 'approved' }))} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '10px 18px', borderRadius: 11, background: 'var(--success)', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Validar</span>
                          </>
                        ) : (
                          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '11px 18px', borderRadius: 11, background: st === 'approved' ? 'var(--status-delivered-bg)' : 'var(--accent-slate-bg)', color: st === 'approved' ? 'var(--status-delivered-fg)' : 'var(--accent-slate-fg)', fontSize: 14, fontWeight: 700 }}>{st === 'approved' ? '✓ Validada' : 'Rechazada'}</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {view === 'usuarios' && (
            <div>
              <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 20 }}>
                <div>
                  <h1 style={{ margin: 0, fontSize: 28, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Usuarios</h1>
                  <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, marginTop: 4 }}>Equipo del operador · {USERS_RAW.length} miembros · {USERS_RAW.filter(u => u.status === 'Activo').length} activos</div>
                </div>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '11px 18px', borderRadius: 11, background: 'var(--brand)', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer', boxShadow: '0 4px 12px var(--brand-shadow)' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14" /></svg>Invitar usuario
                </span>
              </div>
              <div style={{ display: 'flex', gap: 9, marginBottom: 16 }}>
                {['Todos', 'Operador', 'Soporte', 'Finanzas', 'Solo lectura'].map((label) => {
                  const active = roleFilter === label;
                  return <span key={label} onClick={() => setRoleFilter(label)} style={{ padding: '8px 16px', borderRadius: 999, fontSize: 14, fontWeight: 600, cursor: 'pointer', background: active ? 'var(--ink-900)' : '#fff', color: active ? '#fff' : 'var(--ink-600)', border: `1px solid ${active ? 'var(--ink-900)' : 'var(--border-strong)'}` }}>{label}</span>;
                })}
              </div>
              <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, boxShadow: 'var(--shadow-xs)', overflow: 'hidden' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '2.2fr 1.3fr 1.1fr 1fr auto', gap: 18, padding: '14px 24px', borderBottom: '1px solid var(--border-hairline)', background: 'var(--surface-muted)' }}>
                  {['Usuario', 'Rol', 'Estado', 'Último acceso'].map((h) => <span key={h} style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)' }}>{h}</span>)}
                  <span style={{ width: 32 }} />
                </div>
                {users.map((u) => {
                  const rm = ROLE_META[u.role], sm = STATUS_META[u.status];
                  return (
                    <div key={u.id} style={{ display: 'grid', gridTemplateColumns: '2.2fr 1.3fr 1.1fr 1fr auto', gap: 18, padding: '15px 24px', alignItems: 'center', borderBottom: '1px solid var(--surface-muted)', background: u.status === 'Suspendido' ? 'var(--surface-row-alt)' : '#fff' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 13, minWidth: 0 }}>
                        <span style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--brand-soft)', color: 'var(--brand-strong)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 800, flexShrink: 0 }}>{initialsOf(u.name)}</span>
                        <span style={{ display: 'flex', flexDirection: 'column', gap: 1, minWidth: 0 }}>
                          <span style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>{u.name}</span>
                          <span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{u.email}</span>
                        </span>
                      </div>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, width: 'max-content', padding: '5px 11px', borderRadius: 8, background: rm.bg, color: rm.col, fontSize: 13, fontWeight: 700 }}><span style={{ width: 7, height: 7, borderRadius: '50%', background: rm.dot }} />{u.role}</span>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, width: 'max-content', padding: '5px 11px', borderRadius: 999, background: sm.bg, color: sm.col, fontSize: 13, fontWeight: 700 }}>{u.status}</span>
                      <span style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, fontVariantNumeric: 'tabular-nums' }}>{u.lastAccess}</span>
                      <span style={{ width: 32, height: 32, borderRadius: 8, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-100)', cursor: 'pointer' }}><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" /></svg></span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {view === 'configuracion' && (
            <div style={{ maxWidth: 880 }}>
              <h1 style={{ margin: 0, fontSize: 28, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Configuración</h1>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, margin: '4px 0 22px' }}>Parámetros globales del operador CasiLlego</div>

              <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: 24, boxShadow: 'var(--shadow-xs)', marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 18 }}>Identidad del operador</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px 24px' }}>
                  {[{ label: 'Nombre comercial', value: 'CasiLlego Operaciones' }, { label: 'Dominio', value: 'app.casillego.mx' }, { label: 'Zona horaria', value: 'America/Mexico_City (GMT-6)' }, { label: 'Contacto de soporte', value: 'soporte@casillego.mx' }].map((f) => (
                    <div key={f.label} style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-300)' }}>{f.label}</span>
                      <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-900)', background: 'var(--surface-sunken)', border: '1px solid var(--border)', borderRadius: 10, padding: '11px 14px' }}>{f.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: 24, boxShadow: 'var(--shadow-xs)', marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 6 }}>Reglas de recogida</div>
                <div style={{ fontSize: 13, color: 'var(--ink-200)', fontWeight: 500, marginBottom: 18 }}>Aplican a todas las instituciones salvo excepción</div>
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  {[{ label: 'Ventana de tolerancia', help: 'Margen tras la hora de salida programada', value: '15 min' }, { label: 'Radio de geocerca', help: 'Distancia para activar "Ya voy" del tutor', value: '300 m' }, { label: 'Código de salida', help: 'Verificación en la puerta', value: 'QR + PIN' }].map((r) => (
                    <div key={r.label} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 20, padding: '15px 0', borderTop: '1px solid var(--surface-muted)' }}>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                        <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-900)' }}>{r.label}</span>
                        <span style={{ fontSize: 13, color: 'var(--ink-200)', fontWeight: 500 }}>{r.help}</span>
                      </div>
                      <span style={{ fontSize: 16, fontWeight: 800, color: 'var(--ink-700)', background: 'var(--surface-sunken)', border: '1px solid var(--border)', borderRadius: 9, padding: '8px 14px', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>{r.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: 'flex', gap: 16 }}>
                {[
                  { title: 'Notificaciones', items: [['push', 'Push a tutores', 'Avisos de recogida en la app'], ['sms', 'SMS de respaldo', 'Si el push no se entrega'], ['correo', 'Resumen por correo', 'Reporte diario a instituciones']] },
                  { title: 'Seguridad', items: [['dosFA', '2FA obligatorio', 'Para todo el equipo operador'], ['auditoria', 'Registro de auditoría', 'Guarda cada acción sensible'], ['sesion', 'Cierre por inactividad', 'Sesión expira a los 30 min']] },
                ].map((g) => (
                  <div key={g.title} style={{ flex: 1, background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: 24, boxShadow: 'var(--shadow-xs)' }}>
                    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 14 }}>{g.title}</div>
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                      {g.items.map(([key, label, help]) => (
                        <div key={key} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14, padding: '13px 0', borderTop: '1px solid var(--surface-muted)' }}>
                          <span style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-900)' }}>{label}</span>
                            <span style={{ fontSize: 12, color: 'var(--ink-200)', fontWeight: 500 }}>{help}</span>
                          </span>
                          <span onClick={() => toggle(key)} style={{ width: 44, height: 26, borderRadius: 999, background: toggles[key] ? 'var(--brand)' : 'var(--border-strong)', flexShrink: 0, cursor: 'pointer', position: 'relative', transition: 'background .15s' }}>
                            <span style={{ position: 'absolute', top: 3, left: toggles[key] ? 21 : 3, width: 20, height: 20, borderRadius: '50%', background: '#fff', boxShadow: '0 1px 3px rgba(14,31,48,.3)', transition: 'left .15s' }} />
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PortalAdmin() {
  const [role, setRole] = React.useState('institucion');
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'center' }}>
      <div style={{ display: 'inline-flex', gap: 4, background: '#fff', border: '1px solid var(--border-strong)', borderRadius: 11, padding: 4, fontFamily: 'var(--font-sans)' }}>
        {[['institucion', 'Institución'], ['ops', 'Operador global (OPS)']].map(([key, label]) => (
          <span key={key} onClick={() => setRole(key)} style={{ padding: '8px 16px', borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: 'pointer', background: role === key ? 'var(--ink-900)' : 'transparent', color: role === key ? '#fff' : 'var(--ink-300)' }}>{label}</span>
        ))}
      </div>
      {role === 'institucion' ? <InstitutionRole /> : <OpsRole />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(PortalAdmin));
</script>
<script>
(function () {
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
})();
</script>

<!DOCTYPE html>
<!-- @dsCard group="Acceso" viewport="1180x740" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg-canvas-alt);display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel-src" id="app-src">

function Field({ label, value, action }) {
  return (
    <span style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
      <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-600)' }}>{label}</span>
        {action}
      </span>
      <span style={{ height: 46, border: '1px solid var(--border-strong)', borderRadius: 10, padding: '0 14px', display: 'flex', alignItems: 'center', fontSize: 15, color: 'var(--ink-200)' }}>{value}</span>
    </span>
  );
}

function BrandPanel() {
  return (
    <div style={{ width: 470, flexShrink: 0, background: 'var(--ink-900)', color: '#fff', position: 'relative', overflow: 'hidden', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '38px 40px' }}>
      <svg viewBox="0 0 470 740" width="470" height="740" style={{ position: 'absolute', inset: 0, opacity: .5 }} preserveAspectRatio="xMidYMid slice">
        <g stroke="rgba(255,255,255,.06)" strokeWidth="1.5" fill="none">
          <path d="M-20 180 H 520" /><path d="M-20 380 H 520" /><path d="M-20 560 H 520" />
          <path d="M120 -20 V 780" /><path d="M320 -20 V 780" />
        </g>
        <path d="M70 640 V 380 H 320 V 150 H 470" fill="none" stroke="var(--brand)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" opacity=".55" strokeDasharray="3 10" />
        <circle cx="70" cy="640" r="6" fill="var(--brand)" opacity=".7" />
        <circle cx="320" cy="380" r="7" fill="var(--brand)" opacity=".8" />
        <circle cx="320" cy="150" r="6" fill="#34D399" opacity=".7" />
      </svg>
      <div style={{ position: 'absolute', width: 360, height: 360, borderRadius: '50%', background: 'radial-gradient(circle,rgba(251,106,69,.22),transparent 70%)', top: -120, right: -120 }} />
      <span style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', gap: 10 }}>
        <img src="../../assets/pin-mark-inverse.svg" width="29" height="34" alt="" />
        <span style={{ fontSize: 22, fontWeight: 800, letterSpacing: '-.02em' }}>Casi<span style={{ color: 'var(--brand)' }}>Llego</span></span>
      </span>
      <div style={{ position: 'relative' }}>
        <div style={{ fontSize: 38, fontWeight: 800, letterSpacing: '-.03em', lineHeight: 1.08 }}>Menos fila.<br />Más <span style={{ background: 'linear-gradient(120deg,#FFB088,var(--brand))', WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' }}>calma</span> a la salida.</div>
        <div style={{ fontSize: 16, color: 'rgba(255,255,255,.6)', fontWeight: 500, lineHeight: 1.5, marginTop: 16, maxWidth: 340 }}>La plataforma que coordina la recogida entre familias e instituciones, sin congestionar la puerta.</div>
      </div>
      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', gap: 13 }}>
        {['El tutor avisa que va en camino', 'ETA en vivo para la institución', 'Tablero de llegadas claro y a distancia'].map((t) => (
          <span key={t} style={{ display: 'flex', alignItems: 'center', gap: 11, fontSize: 14, color: 'rgba(255,255,255,.78)', fontWeight: 500 }}>
            <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'rgba(251,106,69,.2)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
            </span>{t}
          </span>
        ))}
      </div>
    </div>
  );
}

function Access() {
  const [view, setView] = React.useState('login');

  return (
    <div style={{ width: 1180, height: 740, flexShrink: 0, display: 'flex', borderRadius: 20, overflow: 'hidden', boxShadow: 'var(--shadow-frame)', fontFamily: 'var(--font-sans)' }}>
      <BrandPanel />
      <div style={{ flex: 1, background: '#fff', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '48px 56px', minWidth: 0, overflow: 'auto' }}>

        {view === 'login' && (
          <div style={{ maxWidth: 380, width: '100%', margin: '0 auto' }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-200)' }}>Bienvenido de nuevo</div>
            <h1 style={{ margin: '6px 0 28px', fontSize: 30, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Entrar</h1>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Field label="Correo electrónico" value="laura.mora@gmail.com" />
              <Field label="Contraseña" value={<span style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%' }}><span style={{ letterSpacing: 2, fontSize: 18, color: 'var(--ink-900)' }}>••••••••</span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink-200)" strokeWidth="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></svg></span>} action={<span style={{ fontSize: 13, fontWeight: 600, color: 'var(--brand)', cursor: 'pointer' }}>¿Olvidaste tu contraseña?</span>} />
              <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 50, borderRadius: 13, background: 'var(--brand)', color: '#fff', fontSize: 16, fontWeight: 700, cursor: 'pointer', boxShadow: '0 8px 18px var(--brand-shadow)' }}>Entrar</span>
            </div>
            <div style={{ textAlign: 'center', fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, marginTop: 26 }}>¿Primera vez en CasiLlego? <span onClick={() => setView('choose')} style={{ color: 'var(--brand)', fontWeight: 700, cursor: 'pointer' }}>Crear cuenta</span></div>
          </div>
        )}

        {view === 'choose' && (
          <div style={{ maxWidth: 520, width: '100%', margin: '0 auto' }}>
            <h1 style={{ margin: '0 0 4px', fontSize: 30, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Crear cuenta</h1>
            <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, marginBottom: 26 }}>¿Cómo vas a usar CasiLlego? Elige tu tipo de cuenta.</div>
            <div style={{ display: 'flex', gap: 16 }}>
              <div onClick={() => setView('escuela')} style={{ flex: 1, border: '1px solid var(--border)', borderRadius: 16, padding: 22, cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 13 }}>
                <span style={{ width: 48, height: 48, borderRadius: 13, background: 'var(--brand-soft)', color: 'var(--brand-strong)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V8l7-4 7 4v13" /><path d="M9 21v-5h6v5" /></svg></span>
                <span style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>Escuela o institución</span>
                <span style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.45, flex: 1 }}>Administra la salida, aprueba alumnos y opera el tablero de llegadas.</span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, color: 'var(--brand)', fontSize: 14, fontWeight: 700 }}>Registrar institución <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg></span>
              </div>
              <div onClick={() => setView('tutor')} style={{ flex: 1, border: '1px solid var(--border)', borderRadius: 16, padding: 22, cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 13 }}>
                <span style={{ width: 48, height: 48, borderRadius: 13, background: 'var(--accent-teal-bg)', color: 'var(--accent-teal-fg)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="9" cy="8" r="3.2" /><path d="M3 20a6 6 0 0112 0" /><path d="M16 5.5a3 3 0 010 5.5M19 20a6 6 0 00-3.5-5.5" /></svg></span>
                <span style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>Tutor o familia</span>
                <span style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.45, flex: 1 }}>Avisa cuando vas en camino y gestiona a tus hijos y sus instituciones.</span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, color: 'var(--accent-teal-fg)', fontSize: 14, fontWeight: 700 }}>Registrar como tutor <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg></span>
              </div>
            </div>
            <div style={{ textAlign: 'center', fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, marginTop: 24 }}>¿Ya tienes cuenta? <span onClick={() => setView('login')} style={{ color: 'var(--brand)', fontWeight: 700, cursor: 'pointer' }}>Entrar</span></div>
          </div>
        )}

        {view === 'escuela' && (
          <div style={{ maxWidth: 440, width: '100%', margin: '0 auto' }}>
            <span onClick={() => setView('choose')} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 14, color: 'var(--ink-300)', fontWeight: 600, cursor: 'pointer', marginBottom: 14 }}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>Volver</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}><span style={{ width: 34, height: 34, borderRadius: 10, background: 'var(--brand-soft)', color: 'var(--brand-strong)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V8l7-4 7 4v13" /><path d="M9 21v-5h6v5" /></svg></span><h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Registrar institución</h1></div>
            <div style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, marginBottom: 22 }}>Crea la cuenta de tu escuela o centro de actividades.</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 15 }}>
              <Field label="Nombre de la institución" value="Colegio Simón Bolívar" />
              <Field label="Nombre del responsable" value="Rocío Martínez" />
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                <Field label="Correo" value="admin@colegio.mx" />
                <Field label="Teléfono" value="55 0000 0000" />
              </div>
              <Field label="Contraseña" value={<span style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%' }}><span style={{ letterSpacing: 2, fontSize: 18, color: 'var(--ink-900)' }}>••••••••</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-200)" strokeWidth="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></svg></span>} />
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, background: 'rgba(245,158,11,.10)', border: '1px solid rgba(245,158,11,.3)', borderRadius: 12, padding: '12px 14px', margin: '18px 0' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--status-arriving-fg)" strokeWidth="2" style={{ flexShrink: 0, marginTop: 1 }}><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16v.01" /></svg>
              <span style={{ fontSize: 13, color: 'var(--status-arriving-fg)', fontWeight: 500, lineHeight: 1.4 }}>Tu institución quedará <b style={{ fontWeight: 700 }}>pendiente de validación</b> por el equipo de CasiLlego antes de operar.</span>
            </div>
            <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 50, borderRadius: 13, background: 'var(--brand)', color: '#fff', fontSize: 16, fontWeight: 700, cursor: 'pointer', boxShadow: '0 8px 18px var(--brand-shadow)' }}>Registrar institución</span>
          </div>
        )}

        {view === 'tutor' && (
          <div style={{ maxWidth: 440, width: '100%', margin: '0 auto' }}>
            <span onClick={() => setView('choose')} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 14, color: 'var(--ink-300)', fontWeight: 600, cursor: 'pointer', marginBottom: 14 }}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>Volver</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}><span style={{ width: 34, height: 34, borderRadius: 10, background: 'var(--accent-teal-bg)', color: 'var(--accent-teal-fg)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="9" cy="8" r="3.2" /><path d="M3 20a6 6 0 0112 0" /><path d="M16 5.5a3 3 0 010 5.5M19 20a6 6 0 00-3.5-5.5" /></svg></span><h1 style={{ margin: 0, fontSize: 26, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Crear cuenta de tutor</h1></div>
            <div style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, marginBottom: 22 }}>Una cuenta para avisar tus llegadas y gestionar a tus hijos.</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 15 }}>
              <Field label="Nombre completo" value="Laura Mora Beltrán" />
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                <Field label="Correo" value="laura.mora@gmail.com" />
                <Field label="Teléfono" value="55 1843 2290" />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                <Field label="Contraseña" value={<span style={{ letterSpacing: 2, fontSize: 18, color: 'var(--ink-900)' }}>••••••</span>} />
                <Field label="Confirmar" value={<span style={{ letterSpacing: 2, fontSize: 18, color: 'var(--ink-900)' }}>••••••</span>} />
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, background: 'var(--accent-teal-bg)', border: '1px solid rgba(14,165,164,.3)', borderRadius: 12, padding: '12px 14px', margin: '18px 0' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-teal-fg)" strokeWidth="2" style={{ flexShrink: 0, marginTop: 1 }}><circle cx="12" cy="12" r="9" /><path d="M9 12l2 2 4-4" /></svg>
              <span style={{ fontSize: 13, color: 'var(--accent-teal-fg)', fontWeight: 500, lineHeight: 1.4 }}>Después podrás registrar a tus hijos y solicitar su asociación a la institución.</span>
            </div>
            <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 50, borderRadius: 13, background: 'var(--accent-teal)', color: '#fff', fontSize: 16, fontWeight: 700, cursor: 'pointer', boxShadow: '0 8px 18px rgba(14,165,164,.28)' }}>Crear cuenta</span>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Access));
</script>
<script>
(function () {
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
})();
</script>
</body></html>

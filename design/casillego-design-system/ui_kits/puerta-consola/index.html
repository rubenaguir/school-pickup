<!DOCTYPE html>
<!-- @dsCard group="Puerta" viewport="1360x940" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg-canvas-alt);display:flex;align-items:center;justify-content:center}
#scale-wrap{transform-origin:center center}
@keyframes yv-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes yv-pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,165,164,0)}50%{box-shadow:0 0 0 7px rgba(14,165,164,.18)}}
</style>
</head>
<body>
<div id="scale-wrap"><div id="root"></div></div>
<script type="text/babel-src" id="app-src">

const S = {
  arrived:   { label: 'En puerta', color: 'var(--status-arrived)',  soft: 'var(--status-arrived-bg)' },
  arriving:  { label: 'Llegando',  color: 'var(--status-arriving)', soft: 'var(--status-arriving-bg)' },
  en_route:  { label: 'En camino', color: 'var(--status-en-route)', soft: 'var(--status-en-route-bg)' },
  delivered: { label: 'Entregado', color: 'var(--status-delivered)',soft: 'var(--status-delivered-bg)' },
};

const ROSTER = [
  { id: 'valentina', name: 'Valentina Cruz Peña',  grupo: 'K2',  nivel: 'Preescolar', matricula: 'A-10501', initials: 'VC', statusKey: 'arrived',  etaMin: 0,  code: '4821', pName: 'Marisol Peña',      pRel: 'Mamá',   pInit: 'MP', vehiculo: 'Nissan Kicks rojo',  placa: 'PCM-90-12' },
  { id: 'sebastian', name: 'Sebastián Ortiz Luna', grupo: '6°B', nivel: 'Primaria',   matricula: 'A-10412', initials: 'SO', statusKey: 'arrived',  etaMin: 0,  code: '7193', pName: 'Pablo Ortiz',        pRel: 'Papá',   pInit: 'PO', vehiculo: 'Mazda 3 azul',       placa: 'SMT-08-45' },
  { id: 'diego',     name: 'Diego Hernández Lira', grupo: '5°A', nivel: 'Primaria',   matricula: 'A-10455', initials: 'DH', statusKey: 'arriving', etaMin: 2,  code: '5560', pName: 'Roberto Hernández',  pRel: 'Papá',   pInit: 'RH', vehiculo: 'VW Jetta blanco',    placa: 'NLT-44-21' },
  { id: 'renata',    name: 'Renata Salas Vega',    grupo: '4°A', nivel: 'Primaria',   matricula: 'A-10470', initials: 'RS', statusKey: 'arriving', etaMin: 3,  code: '3048', pName: 'Carmen Vega',        pRel: 'Abuela', pInit: 'CV', vehiculo: 'Honda CR-V plata',   placa: 'RFG-31-88' },
  { id: 'camila',    name: 'Camila Reyes Mora',    grupo: '3°B', nivel: 'Primaria',   matricula: 'A-10428', initials: 'CR', statusKey: 'en_route', etaMin: 6,  code: '8810', pName: 'Laura Mora',         pRel: 'Mamá',   pInit: 'LM', vehiculo: 'Mazda CX-5 gris',    placa: 'ABC-12-34' },
  { id: 'mateo',     name: 'Mateo Domínguez Ríos', grupo: '1°C', nivel: 'Secundaria', matricula: 'A-10388', initials: 'MD', statusKey: 'en_route', etaMin: 9,  code: '2274', pName: 'José Luna',          pRel: 'Chofer', pInit: 'JL', vehiculo: 'Toyota Hiace',       placa: 'UEV-77-03', chofer: true },
  { id: 'ximena',    name: 'Ximena Flores Ávila',  grupo: '2°B', nivel: 'Primaria',   matricula: 'A-10444', initials: 'XF', statusKey: 'en_route', etaMin: 11, code: '6602', pName: 'Diana Ávila',        pRel: 'Mamá',   pInit: 'DA', vehiculo: 'Kia Sportage',       placa: 'TZX-19-60' },
  { id: 'emiliano',  name: 'Emiliano Navarro Gil', grupo: 'K3',  nivel: 'Preescolar', matricula: 'A-10399', initials: 'EN', statusKey: 'arrived',  etaMin: 0,  code: '1457', pName: 'Sofía Gil',          pRel: 'Mamá',   pInit: 'SG', vehiculo: 'Chevrolet Aveo',     placa: 'VBN-55-12' },
];

function pad(n) { return String(n).padStart(2, '0'); }
function fmt(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function GateConsole() {
  const [now, setNow] = React.useState(Date.now());
  const [selectedId, setSelectedId] = React.useState('valentina');
  const [announcing, setAnnouncing] = React.useState({});
  const [delivered, setDelivered] = React.useState({});
  const [reported, setReported] = React.useState({});

  React.useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  const clock = new Intl.DateTimeFormat('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(now));
  let dateText = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(now));
  dateText = dateText.charAt(0).toUpperCase() + dateText.slice(1);

  const resolve = (r) => {
    const isDel = !!delivered[r.id];
    const sk = isDel ? 'delivered' : r.statusKey;
    const m = S[sk];
    const isAnnouncing = !!announcing[r.id] && !isDel;
    const etaText = sk === 'arrived' ? 'En puerta' : sk === 'delivered' ? delivered[r.id] : r.etaMin + ' min';
    return { ...r, sk, m, isDel, isAnnouncing, etaText, sub: r.grupo + ' · ' + r.nivel };
  };

  const all = ROSTER.map(resolve);
  const prio = { arrived: 0, arriving: 1, en_route: 2, delivered: 3 };
  const sorted = [...all].sort((a, b) =>
    ((a.isDel ? 1 : 0) - (b.isDel ? 1 : 0)) ||
    ((b.isAnnouncing ? 1 : 0) - (a.isAnnouncing ? 1 : 0)) ||
    (prio[a.sk] - prio[b.sk]) ||
    (a.etaMin - b.etaMin)
  );

  const sel = all.find((r) => r.id === selectedId) || all[0];
  const nextActive = sorted.find((r) => !r.isDel && r.id !== sel.id);
  const nextId = nextActive ? nextActive.id : sel.id;
  const stamp = fmt(now);

  let selEtaLine;
  if (sel.isDel) selEtaLine = 'Entregado a las ' + delivered[sel.id];
  else if (sel.sk === 'arrived') selEtaLine = sel.isAnnouncing ? 'Voceando ahora — esperando en el punto de entrega' : 'En el área de entrega · listo para vocear';
  else selEtaLine = 'Llega en ' + sel.etaMin + ' min · aprox. ' + fmt(now + sel.etaMin * 60000);

  const isReported = !!reported[sel.id];
  const announceActive = all.find((r) => r.isAnnouncing);

  const doVocear = () => setAnnouncing((s) => ({ ...s, [sel.id]: true }));
  const doEntregar = () => {
    setDelivered((s) => ({ ...s, [sel.id]: stamp }));
    setAnnouncing((s) => { const n = { ...s }; delete n[sel.id]; return n; });
    setSelectedId(nextId);
  };
  const doDeshacer = () => setDelivered((s) => { const n = { ...s }; delete n[sel.id]; return n; });
  const doReportar = () => setReported((s) => ({ ...s, [sel.id]: true }));

  return (
    <div style={{ width: 1360, height: 940, display: 'flex', flexDirection: 'column', borderRadius: 20, overflow: 'hidden', boxShadow: 'var(--shadow-frame)', background: 'var(--bg-canvas-alt)', fontFamily: 'var(--font-sans)' }}>
      {/* TOP BAR */}
      <div style={{ flexShrink: 0, background: 'var(--ink-900)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 28px', height: 82 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 9 }}>
            <img src="../../assets/pin-mark.svg" width="28" height="32" alt="" />
            <span style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.02em' }}>Casi<span style={{ color: 'var(--brand)' }}>Llego</span></span>
            <span style={{ fontSize: 10, fontWeight: 800, letterSpacing: '.08em', color: 'var(--brand)', background: 'rgba(251,106,69,.16)', padding: '3px 7px', borderRadius: 6 }}>PUERTA</span>
          </span>
          <span style={{ width: 1, height: 34, background: 'rgba(255,255,255,.12)' }} />
          <span style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.25 }}>
            <span style={{ fontSize: 16, fontWeight: 700, letterSpacing: '-.01em' }}>Colegio Simón Bolívar · Coyoacán</span>
            <span style={{ fontSize: 12, color: 'rgba(255,255,255,.55)', fontWeight: 500 }}>Salida vespertina · 14:00–14:30</span>
          </span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 13, fontWeight: 700, background: 'rgba(14,165,164,.18)', color: '#5EEAD4', padding: '6px 13px', borderRadius: 999 }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--status-arrived)' }} />{all.filter(r => r.sk === 'arrived').length} en puerta</span>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 13, fontWeight: 700, background: 'rgba(59,130,246,.18)', color: '#93C5FD', padding: '6px 13px', borderRadius: 999 }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--status-en-route)' }} />{all.filter(r => r.sk === 'arriving' || r.sk === 'en_route').length} en camino</span>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 13, fontWeight: 700, background: 'rgba(34,197,94,.18)', color: '#86EFAC', padding: '6px 13px', borderRadius: 999 }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--status-delivered)' }} />{all.filter(r => r.isDel).length} entregados</span>
          </span>
          <span style={{ width: 1, height: 34, background: 'rgba(255,255,255,.12)' }} />
          <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', lineHeight: 1.05 }}>
            <span style={{ fontSize: 26, fontWeight: 800, fontVariantNumeric: 'tabular-nums', letterSpacing: '-.02em' }}>{clock}</span>
            <span style={{ fontSize: 11, color: 'rgba(255,255,255,.5)', fontWeight: 500, marginTop: 2 }}>{dateText}</span>
          </span>
          <span style={{ width: 40, height: 40, borderRadius: '50%', background: 'rgba(255,255,255,.12)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700 }}>JR</span>
        </div>
      </div>

      {/* BODY */}
      <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
        {/* QUEUE */}
        <div style={{ width: 452, flexShrink: 0, background: 'var(--surface-muted)', borderRight: '1px solid var(--border-strong)', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
          <div style={{ flexShrink: 0, padding: '20px 22px 14px' }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 20, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Fila de salida</span>
              <span style={{ fontSize: 13, color: 'var(--ink-200)', fontWeight: 600 }}>{all.filter(r => !r.isDel).length} en fila</span>
            </div>
            <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 10, background: 'var(--ink-900)', borderRadius: 13, padding: '11px 15px' }}>
              {announceActive ? (
                <>
                  <span style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 17, flexShrink: 0 }}>
                    <span style={{ width: 3, height: '100%', background: 'var(--brand)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite' }} />
                    <span style={{ width: 3, height: '100%', background: 'var(--brand)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .15s' }} />
                    <span style={{ width: 3, height: '100%', background: 'var(--brand)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .3s' }} />
                  </span>
                  <span style={{ fontSize: 13, color: 'rgba(255,255,255,.78)', fontWeight: 500 }}>Voceando: <b style={{ color: '#fff', fontWeight: 800 }}>{announceActive.name}</b></span>
                </>
              ) : (
                <>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'rgba(255,255,255,.3)', flexShrink: 0 }} />
                  <span style={{ fontSize: 13, color: 'rgba(255,255,255,.5)', fontWeight: 500 }}>Sin voceo activo</span>
                </>
              )}
            </div>
          </div>
          <div style={{ flex: 1, overflow: 'auto', padding: '4px 16px 20px', display: 'flex', flexDirection: 'column', gap: 9 }}>
            {sorted.map((r) => {
              const selected = r.id === selectedId;
              return (
                <div key={r.id} onClick={() => setSelectedId(r.id)} style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 13, padding: '13px 16px 13px 18px', borderRadius: 14, cursor: 'pointer', background: selected ? '#fff' : (r.isDel ? 'var(--surface-row-alt)' : '#fff'), border: `1px solid ${selected ? 'var(--brand)' : 'var(--border)'}`, boxShadow: selected ? '0 8px 20px rgba(251,106,69,.16)' : 'var(--shadow-xs)', opacity: r.isDel ? 0.6 : 1, overflow: 'hidden' }}>
                  <span style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 4, background: r.m.color }} />
                  <span style={{ width: 46, height: 46, borderRadius: 13, background: r.m.soft, color: r.m.color, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 800, flexShrink: 0 }}>{r.initials}</span>
                  <span style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                    <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--ink-900)', letterSpacing: '-.01em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.name}</span>
                    <span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500 }}>{r.sub}</span>
                  </span>
                  <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 5, flexShrink: 0 }}>
                    {r.isAnnouncing ? (
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 800, color: 'var(--status-arrived-fg)' }}>
                        <span style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 }}>
                          <span style={{ width: 2.5, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite' }} />
                          <span style={{ width: 2.5, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .15s' }} />
                          <span style={{ width: 2.5, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .3s' }} />
                        </span>Voceando
                      </span>
                    ) : (
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 700, color: r.m.color, background: r.m.soft, padding: '4px 10px', borderRadius: 999 }}>
                        <span style={{ width: 7, height: 7, borderRadius: '50%', background: r.m.color }} />{r.m.label}
                      </span>
                    )}
                    <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-600)', fontVariantNumeric: 'tabular-nums' }}>{r.etaText}</span>
                  </span>
                </div>
              );
            })}
          </div>
        </div>

        {/* DETAIL */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--surface-sunken)' }}>
          <div style={{ flex: 1, overflow: 'auto', padding: '30px 36px 0' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
              <span style={{ width: 78, height: 78, borderRadius: 20, background: sel.m.soft, color: sel.m.color, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, fontWeight: 800, flexShrink: 0 }}>{sel.initials}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 32, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em', lineHeight: 1.05 }}>{sel.name}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 7 }}>
                  <span style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 600 }}>{sel.sub}</span>
                  <span style={{ fontSize: 13, color: 'var(--ink-200)', fontFamily: 'var(--font-mono)', letterSpacing: '.03em' }}>Matrícula {sel.matricula}</span>
                </div>
              </div>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '9px 16px', borderRadius: 999, fontSize: 15, fontWeight: 800, background: sel.m.soft, color: sel.m.color, flexShrink: 0 }}>
                <span style={{ width: 9, height: 9, borderRadius: '50%', background: sel.m.color }} />{sel.m.label}
              </span>
            </div>
            <div style={{ marginTop: 14, fontSize: 15, color: 'var(--ink-300)', fontWeight: 600 }}>{selEtaLine}</div>
            <div style={{ height: 1, background: 'var(--border)', margin: '24px 0' }} />
            <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 12 }}>Quién recoge</div>
            <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: '20px 22px', boxShadow: 'var(--shadow-xs)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <span style={{ width: 54, height: 54, borderRadius: '50%', background: 'rgba(14,31,48,.07)', color: 'var(--ink-700)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, fontWeight: 800, flexShrink: 0 }}>{sel.pInit}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 19, fontWeight: 700, color: 'var(--ink-900)' }}>{sel.pName}</div>
                  <div style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, marginTop: 1 }}>{sel.pRel}</div>
                </div>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '8px 14px', borderRadius: 999, background: 'rgba(22,163,74,.12)', color: 'var(--status-delivered-fg)', fontSize: 13, fontWeight: 800, flexShrink: 0 }}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.2-7 9.5C8 19.2 5 15.4 5 11V6l7-3z" /><path d="M9.5 11.5l1.8 1.8 3.5-3.5" /></svg>{sel.chofer ? 'Chofer autorizado' : 'Tutor autorizado'}
                </span>
              </div>
              <div style={{ height: 1, background: 'var(--border-hairline)', margin: '16px 0' }} />
              <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
                <span style={{ width: 34, height: 34, borderRadius: 9, background: 'var(--surface-muted)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-300)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l1.5-4.5A2 2 0 018.4 7h7.2a2 2 0 011.9 1.5L19 13M5 13h14v4H5zM5 17v2M19 17v2" /><circle cx="7.5" cy="15" r="1" /><circle cx="16.5" cy="15" r="1" /></svg>
                </span>
                <span style={{ fontSize: 15, color: 'var(--ink-600)', fontWeight: 600 }}>{sel.vehiculo}</span>
                <span style={{ marginLeft: 'auto', fontSize: 14, fontWeight: 700, color: 'var(--ink-700)', fontFamily: 'var(--font-mono)', letterSpacing: '.05em', background: 'var(--surface-muted)', border: '1px solid var(--border)', padding: '5px 11px', borderRadius: 8 }}>{sel.placa}</span>
              </div>
            </div>
            {!sel.isDel && (
              <React.Fragment>
                <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', margin: '22px 0 12px' }}>Código de entrega</div>
                <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: '18px 22px', display: 'flex', alignItems: 'center', gap: 20, boxShadow: 'var(--shadow-xs)' }}>
                  <span style={{ fontSize: 40, fontWeight: 800, color: 'var(--ink-900)', fontFamily: 'var(--font-mono)', letterSpacing: '.18em', lineHeight: 1 }}>{sel.code}</span>
                  <span style={{ flex: 1, fontSize: 14, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.4 }}>El tutor muestra este código en su app. Verifica que coincida antes de entregar.</span>
                </div>
              </React.Fragment>
            )}
          </div>

          {/* ACTION FOOTER */}
          <div style={{ flexShrink: 0, borderTop: '1px solid var(--border)', background: '#fff', padding: '18px 36px 20px' }}>
            {sel.isDel ? (
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <span style={{ width: 50, height: 50, borderRadius: '50%', background: 'var(--status-delivered)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                </span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: 'var(--status-delivered-fg)', letterSpacing: '-.01em' }}>Entregado</div>
                  <div style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 600, marginTop: 2 }}>{delivered[sel.id]} · recibió {sel.pName} ({sel.pRel})</div>
                </div>
                <span onClick={doDeshacer} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 48, padding: '0 20px', borderRadius: 13, border: '1px solid var(--border-strong)', color: 'var(--ink-300)', fontSize: 15, fontWeight: 700, cursor: 'pointer' }}>Deshacer</span>
              </div>
            ) : !sel.isAnnouncing ? (
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span onClick={doVocear} style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 11, height: 60, borderRadius: 16, background: 'var(--status-arrived)', color: '#fff', fontSize: 20, fontWeight: 800, cursor: 'pointer', boxShadow: '0 8px 18px rgba(14,165,164,.28)' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l18-5v12L3 14v-3zM11.6 16.8a3 3 0 01-5.8-1.6" /></svg>Vocear a {sel.name.split(' ')[0]}
                </span>
                <span onClick={doEntregar} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 60, padding: '0 22px', borderRadius: 16, border: '1px solid var(--border-strong)', color: 'var(--ink-600)', fontSize: 16, fontWeight: 700, cursor: 'pointer' }}>Entrega directa</span>
              </div>
            ) : (
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 13, background: 'rgba(14,165,164,.10)', border: '1px solid rgba(14,165,164,.32)', borderRadius: 13, padding: '11px 16px', animation: 'yv-pulse 2.4s ease-in-out infinite' }}>
                  <span style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 16, flexShrink: 0 }}>
                    <span style={{ width: 3, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite' }} />
                    <span style={{ width: 3, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .15s' }} />
                    <span style={{ width: 3, height: '100%', background: 'var(--status-arrived)', borderRadius: 2, transformOrigin: 'bottom', animation: 'yv-bar .9s infinite .3s' }} />
                  </span>
                  <span style={{ fontSize: 14, color: 'var(--status-arrived-fg)', fontWeight: 600 }}>Voceando a <b style={{ fontWeight: 800 }}>{sel.name.split(' ')[0]}</b> — esperando en el punto de entrega</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span onClick={doEntregar} style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 11, height: 60, borderRadius: 16, background: 'var(--status-delivered)', color: '#fff', fontSize: 20, fontWeight: 800, cursor: 'pointer', boxShadow: '0 8px 18px rgba(22,163,74,.28)' }}>
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>Confirmar entrega
                  </span>
                  <span onClick={doVocear} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 60, padding: '0 22px', borderRadius: 16, border: '1px solid var(--border-strong)', color: 'var(--ink-600)', fontSize: 16, fontWeight: 700, cursor: 'pointer' }}>Repetir voceo</span>
                </div>
              </div>
            )}
            {!sel.isDel && (
              <div style={{ marginTop: 13, display: 'flex', justifyContent: 'center' }}>
                <span onClick={doReportar} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 14, fontWeight: 700, color: isReported ? 'var(--ink-200)' : 'var(--danger)', cursor: 'pointer' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.8L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.8a2 2 0 00-3.4 0z" /><path d="M12 9v4M12 17h.01" /></svg>{isReported ? 'Incidencia reportada al administrador' : 'Reportar incidencia'}
                </span>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(GateConsole));
function fitScale() {
  const s = Math.min(1, (window.innerWidth - 24) / 1360, (window.innerHeight - 24) / 940);
  document.getElementById('scale-wrap').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitScale);
fitScale();
</script>

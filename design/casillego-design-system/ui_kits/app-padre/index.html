<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg-canvas-alt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel-src" id="app-src">

/* ============ SURFACE: APP MÓVIL ============ */
const KIDS = [
  { id: 'v', name: 'Valentina Cruz', grade: 'K2 · Colegio Simón Bolívar', accent: 'teal' },
  { id: 'm', name: 'Mateo Domínguez', grade: '1°C · Instituto Patria', accent: 'brand' },
];

function Phone({ children }) {
  return (
    <div style={{ width: 390, height: 780, borderRadius: 46, background: 'var(--ink-900)', padding: 12, boxShadow: 'var(--shadow-frame)', flexShrink: 0 }}>
      <div style={{ width: '100%', height: '100%', borderRadius: 36, overflow: 'hidden', position: 'relative', background: '#EAF1F7' }}>
        <div style={{ position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)', width: 120, height: 26, background: 'var(--ink-900)', borderRadius: 14, zIndex: 5 }} />
        {children}
      </div>
    </div>
  );
}

function MapScene({ stage }) {
  /* stage: 'enroute' | 'arrived' */
  return (
    <svg viewBox="0 0 402 392" width="402" height="392" style={{ display: 'block', width: '100%', height: '100%' }}>
      <rect width="402" height="392" fill="#DCE7EF" />
      <rect x="-12" y="30" width="150" height="120" rx="14" fill="#E7EFF5" />
      <rect x="175" y="-12" width="190" height="118" rx="16" fill="#E7EFF5" />
      <rect x="255" y="150" width="180" height="150" rx="16" fill="#E7EFF5" />
      <rect x="30" y="240" width="150" height="200" rx="16" fill="#E7EFF5" />
      <rect x="205" y="305" width="130" height="120" rx="16" fill="#D9E9DD" />
      <g stroke="#F5F9FC" strokeWidth="18" strokeLinecap="round" fill="none">
        <path d="M-20 200 H 430" /><path d="M150 -20 V 430" /><path d="M-20 95 H 210" /><path d="M300 -20 V 210" />
      </g>
      {stage === 'enroute' ? (
        <>
          <path d="M70 350 V195 H200 V95 H300" fill="none" stroke="var(--brand)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" opacity="0.22" />
          <path d="M70 350 V195 H200" fill="none" stroke="var(--brand)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />
          <circle cx="70" cy="350" r="7" fill="#fff" stroke="var(--brand)" strokeWidth="3" />
          <circle cx="300" cy="95" r="15" fill="var(--ink-900)" /><circle cx="300" cy="95" r="6" fill="#fff" />
          <circle cx="200" cy="195" r="22" fill="var(--brand)" opacity="0.16" />
          <circle cx="200" cy="195" r="13" fill="var(--brand)" stroke="#fff" strokeWidth="3" />
        </>
      ) : (
        <>
          <path d="M70 350 V195 H200 V95 H300" fill="none" stroke="var(--brand)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />
          <circle cx="70" cy="350" r="7" fill="#fff" stroke="var(--brand)" strokeWidth="3" />
          <circle cx="300" cy="95" r="24" fill="var(--status-arrived)" opacity="0.18" />
          <circle cx="300" cy="95" r="14" fill="var(--status-arrived)" stroke="#fff" strokeWidth="3" />
        </>
      )}
    </svg>
  );
}

function QRCode() {
  return (
    <svg width="176" height="176" viewBox="0 0 33 33" shapeRendering="crispEdges" style={{ display: 'block' }}>
      <rect width="33" height="33" fill="#fff" />
      <rect x="0" y="0" width="7" height="7" fill="var(--ink-900)" /><rect x="1" y="1" width="5" height="5" fill="#fff" /><rect x="2" y="2" width="3" height="3" fill="var(--ink-900)" />
      <rect x="26" y="0" width="7" height="7" fill="var(--ink-900)" /><rect x="27" y="1" width="5" height="5" fill="#fff" /><rect x="28" y="2" width="3" height="3" fill="var(--ink-900)" />
      <rect x="0" y="26" width="7" height="7" fill="var(--ink-900)" /><rect x="1" y="27" width="5" height="5" fill="#fff" /><rect x="2" y="28" width="3" height="3" fill="var(--ink-900)" />
    </svg>
  );
}

const NOTIFS = [
  { group: 'Hoy', color: 'teal', title: 'Valentina está en puerta', body: 'El personal la está entregando. Preséntate en la puerta principal.', when: 'ahora' },
  { group: 'Hoy', color: 'brand', title: 'Recordatorio de salida', body: 'La salida de Valentina es en 15 min. Toca "¡Ya voy!" cuando salgas.', when: '13:45' },
  { group: 'Anterior', color: 'green', title: 'Asociación aprobada', body: 'Instituto Patria aceptó a Mateo Domínguez.', when: 'Ayer · 09:12' },
  { group: 'Anterior', color: 'green', title: 'Entrega confirmada', body: 'Recogiste a Mateo en Instituto Patria · 14:08.', when: 'Ayer · 14:08' },
  { group: 'Anterior', color: 'slate', title: 'Tutor autorizado', body: 'Carmen Beltrán aceptó la invitación para recoger a Valentina.', when: 'Lun · 18:30' },
];
const HISTORY = [
  { group: 'Hoy · martes', name: 'Valentina Cruz', initials: 'VC', color: 'teal', sub: 'Recogió Laura Mora · 14:06', status: 'Entregado' },
  { group: 'Esta semana', name: 'Mateo Domínguez', initials: 'MD', color: 'brand', sub: 'Recogió José Luna · lun 14:08', status: 'Entregado' },
  { group: 'Esta semana', name: 'Valentina Cruz', initials: 'VC', color: 'teal', sub: 'Recogió Esteban Reyes · lun 14:11', status: 'Entregado' },
  { group: 'Esta semana', name: 'Mateo Domínguez', initials: 'MD', color: 'slate', sub: 'Recogida cancelada · vie', status: 'Cancelada' },
];

function ParentApp() {
  const [onboarded, setOnboarded] = React.useState(true);
  const [obStep, setObStep] = React.useState(0);
  const [screen, setScreen] = React.useState('inicio');
  const [tab, setTab] = React.useState('inicio');
  const [kid, setKid] = React.useState(null);
  const [paused, setPaused] = React.useState(false);
  const goVoy = (k) => { setKid(k); setScreen('seguimiento'); setTab('inicio'); };
  const arrive = () => setScreen('enpuerta');
  const confirm = () => setScreen('confirmado');

  if (!onboarded) {
    const steps = ['bienvenida', 'ubicacion', 'notificaciones', 'vincular', 'listo'];
    const step = steps[obStep];
    const next = () => setObStep((s) => Math.min(s + 1, steps.length - 1));
    const finish = () => setOnboarded(true);
    return (
      <Phone>
        {step === 'bienvenida' && (
          <div style={{ height: '100%', position: 'relative', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', background: 'var(--ink-900)', color: '#fff', fontFamily: 'var(--font-sans)', padding: '66px 28px 32px' }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
              <img src="../../assets/pin-mark-inverse.svg" width="29" height="34" alt="" />
              <span style={{ fontSize: 22, fontWeight: 800, letterSpacing: '-.02em' }}>Casi<span style={{ color: 'var(--brand)' }}>Llego</span></span>
            </span>
            <div>
              <div style={{ fontSize: 34, fontWeight: 800, letterSpacing: '-.03em', lineHeight: 1.1 }}>Menos fila.<br />Más <span style={{ background: 'linear-gradient(120deg,#FFB088,var(--brand))', WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' }}>calma</span> a la salida.</div>
              <div style={{ fontSize: 16, color: 'rgba(255,255,255,.6)', fontWeight: 500, lineHeight: 1.5, marginTop: 14, maxWidth: 320 }}>Avisa que vas en camino y recoge a tus hijos sin congestionar la puerta.</div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={{ display: 'flex', gap: 7 }}><span style={{ width: 24, height: 6, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ width: 6, height: 6, borderRadius: 3, background: 'rgba(255,255,255,.25)' }} /><span style={{ width: 6, height: 6, borderRadius: 3, background: 'rgba(255,255,255,.25)' }} /></div>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 56, borderRadius: 16, background: 'var(--brand)', color: '#fff', fontSize: 18, fontWeight: 800, boxShadow: '0 8px 18px var(--brand-shadow)', cursor: 'pointer' }}>Crear cuenta</span>
              <span onClick={finish} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 24, color: 'rgba(255,255,255,.75)', fontSize: 15, fontWeight: 600, cursor: 'pointer' }}>Ya tengo cuenta</span>
            </div>
          </div>
        )}
        {step === 'ubicacion' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#EAF1F7', fontFamily: 'var(--font-sans)', padding: '64px 28px 32px' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}><span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-200)' }}>Paso 1 de 3</span><span onClick={next} style={{ fontSize: 14, fontWeight: 700, color: 'var(--ink-200)', cursor: 'pointer' }}>Omitir</span></div>
              <div style={{ display: 'flex', gap: 6 }}><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--border-strong)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--border-strong)' }} /></div>
            </div>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', gap: 18 }}>
              <span style={{ width: 96, height: 96, borderRadius: 28, background: 'var(--brand-soft)', color: 'var(--brand)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z" /><circle cx="12" cy="10" r="3" /></svg>
              </span>
              <div style={{ fontSize: 25, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Activa tu ubicación</div>
              <div style={{ fontSize: 16, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.5, maxWidth: 300 }}>La usamos <b style={{ color: 'var(--ink-700)' }}>solo cuando tocas "¡Ya voy!"</b> para calcular tu llegada y avisar a la escuela en vivo.</div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 56, borderRadius: 16, background: 'var(--brand)', color: '#fff', fontSize: 18, fontWeight: 800, boxShadow: '0 8px 18px var(--brand-shadow)', cursor: 'pointer' }}>Permitir ubicación</span>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 46, color: 'var(--ink-200)', fontSize: 16, fontWeight: 700, cursor: 'pointer' }}>Ahora no</span>
            </div>
          </div>
        )}
        {step === 'notificaciones' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#EAF1F7', fontFamily: 'var(--font-sans)', padding: '64px 28px 32px' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}><span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-200)' }}>Paso 2 de 3</span><span onClick={next} style={{ fontSize: 14, fontWeight: 700, color: 'var(--ink-200)', cursor: 'pointer' }}>Omitir</span></div>
              <div style={{ display: 'flex', gap: 6 }}><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--border-strong)' }} /></div>
            </div>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', gap: 18 }}>
              <span style={{ width: 96, height: 96, borderRadius: 28, background: 'var(--accent-teal-bg)', color: 'var(--accent-teal)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9a6 6 0 1112 0c0 5 2.5 6 2.5 6H3.5S6 14 6 9z" /><path d="M10.5 20a2 2 0 003 0" /></svg>
              </span>
              <div style={{ fontSize: 25, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Recibe avisos en vivo</div>
              <div style={{ fontSize: 16, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.5, maxWidth: 300 }}>Te avisamos cuando tu hijo está <b style={{ color: 'var(--ink-700)' }}>en puerta</b> y cuando se <b style={{ color: 'var(--ink-700)' }}>completa la entrega</b>.</div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 56, borderRadius: 16, background: 'var(--brand)', color: '#fff', fontSize: 18, fontWeight: 800, boxShadow: '0 8px 18px var(--brand-shadow)', cursor: 'pointer' }}>Activar notificaciones</span>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 46, color: 'var(--ink-200)', fontSize: 16, fontWeight: 700, cursor: 'pointer' }}>Ahora no</span>
            </div>
          </div>
        )}
        {step === 'vincular' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#EAF1F7', fontFamily: 'var(--font-sans)', padding: '64px 24px 32px', overflow: 'auto' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-200)' }}>Paso 3 de 3</span>
              <div style={{ display: 'flex', gap: 6 }}><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /><span style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--brand)' }} /></div>
            </div>
            <div style={{ fontSize: 25, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Vincula a tu hijo</div>
            <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.45, marginTop: 6, marginBottom: 22 }}>Ingresa el código que te dio la institución para encontrar a tu hijo.</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-600)', marginBottom: 8 }}>Código de institución</div>
            <div style={{ display: 'flex', gap: 10, marginBottom: 22 }}>
              <span style={{ flex: 1, height: 54, background: '#fff', border: '1px solid var(--border-strong)', borderRadius: 14, display: 'flex', alignItems: 'center', padding: '0 16px', fontSize: 17, fontWeight: 700, color: 'var(--ink-900)', fontFamily: 'var(--font-mono)', letterSpacing: '.08em' }}>CSB-2024</span>
              <span style={{ width: 54, height: 54, background: 'var(--ink-900)', borderRadius: 14, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff', flexShrink: 0 }}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4-4" /></svg></span>
            </div>
            <div style={{ background: '#fff', borderRadius: 20, boxShadow: '0 8px 22px rgba(14,31,48,.07)', padding: 18, display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span style={{ width: 40, height: 40, borderRadius: 11, background: 'rgba(14,31,48,.07)', color: 'var(--ink-600)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-2" /></svg></span>
                <span style={{ flex: 1 }}><span style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink-900)', display: 'block' }}>Colegio Simón Bolívar</span><span style={{ fontSize: 13, color: 'var(--ink-200)' }}>Coyoacán, CDMX</span></span>
              </div>
              <div style={{ height: 1, background: 'var(--border-hairline)' }} />
              <div style={{ display: 'flex', alignItems: 'center', gap: 13 }}>
                <span style={{ width: 46, height: 46, borderRadius: '50%', background: 'var(--accent-teal-bg)', color: 'var(--accent-teal-fg)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, fontWeight: 800, flexShrink: 0 }}>VC</span>
                <span style={{ flex: 1 }}><span style={{ fontSize: 17, fontWeight: 700, color: 'var(--ink-900)', display: 'block' }}>Valentina Cruz</span><span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500 }}>K2 · Preescolar</span></span>
              </div>
              <span onClick={next} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 52, borderRadius: 14, background: 'var(--brand)', color: '#fff', fontSize: 17, fontWeight: 800, boxShadow: '0 6px 14px rgba(251,106,69,.26)', cursor: 'pointer' }}>Solicitar vínculo</span>
            </div>
          </div>
        )}
        {step === 'listo' && (
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#EAF1F7', fontFamily: 'var(--font-sans)', padding: '64px 28px 32px' }}>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', gap: 20 }}>
              <span style={{ width: 104, height: 104, borderRadius: '50%', background: 'var(--status-delivered-bg)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ width: 74, height: 74, borderRadius: '50%', background: 'var(--status-delivered)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg></span>
              </span>
              <div style={{ fontSize: 27, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>¡Todo listo, Laura!</div>
              <div style={{ fontSize: 16, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.5, maxWidth: 300 }}>Enviamos tu solicitud a Colegio Simón Bolívar. Te avisaremos en cuanto aprueben el vínculo con Valentina.</div>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 9, background: 'var(--status-arriving-bg)', borderRadius: 999, padding: '9px 16px', fontSize: 14, color: 'var(--status-arriving-fg)', fontWeight: 700 }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--status-arriving)' }} />Solicitud en revisión
              </span>
            </div>
            <span onClick={finish} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 56, borderRadius: 16, background: 'var(--brand)', color: '#fff', fontSize: 18, fontWeight: 800, boxShadow: '0 8px 18px var(--brand-shadow)', cursor: 'pointer' }}>Ir al inicio</span>
          </div>
        )}
      </Phone>
    );
  }

  return (
    <Phone>
      {paused && (
        <div style={{ position: 'absolute', inset: 0, zIndex: 10 }}>
          <div style={{ position: 'absolute', inset: 0, filter: 'grayscale(.75) brightness(.97)', opacity: .5 }}><MapScene stage="enroute" /></div>
          <div style={{ position: 'absolute', inset: 0, background: 'var(--surface-overlay)' }} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
            <div style={{ background: '#fff', borderRadius: 24, boxShadow: '0 24px 56px rgba(2,12,27,.34)', padding: '30px 24px 26px', width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', gap: 10 }}>
              <span style={{ width: 56, height: 56, borderRadius: '50%', background: 'var(--surface-muted)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 5, marginBottom: 4 }}>
                <span style={{ width: 6, height: 22, borderRadius: 3, background: 'var(--ink-200)' }} /><span style={{ width: 6, height: 22, borderRadius: 3, background: 'var(--ink-200)' }} />
              </span>
              <div style={{ fontSize: 22, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>Seguimiento en pausa</div>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, lineHeight: 1.45 }}>Saliste de la app. Vuelve a abrirla para reanudar tu llegada en vivo; mientras tanto no actualizamos tu posición.</div>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'var(--surface-muted)', borderRadius: 999, padding: '7px 14px', fontSize: 13, color: 'var(--ink-200)', fontWeight: 600, margin: '6px 0 4px' }}>Último dato: ~8 min · 14:02</span>
              <span onClick={() => setPaused(false)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: 54, borderRadius: 16, background: 'var(--brand)', color: '#fff', fontSize: 18, fontWeight: 800, boxShadow: '0 8px 18px var(--brand-shadow)', cursor: 'pointer' }}>Reanudar seguimiento</span>
            </div>
          </div>
        </div>
      )}

      {screen === 'inicio' && tab === 'inicio' && (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', fontFamily: 'var(--font-sans)' }}>
          <div style={{ padding: '58px 22px 4px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 26, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Hola, Laura</div>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500 }}>¿A quién recoges hoy?</div>
            </div>
            <span onClick={() => setOnboarded(false)} style={{ fontSize: 11, color: 'var(--ink-100)', fontWeight: 600, cursor: 'pointer', border: '1px solid var(--border-strong)', borderRadius: 8, padding: '4px 8px' }}>Ver onboarding</span>
          </div>
          <div style={{ padding: '18px 22px 6px', fontSize: 12, fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--ink-200)' }}>Mis hijos</div>

        <div style={{ padding: '24px 22px 18px', display: 'flex', alignItems: 'center', gap: 9 }}>
          <img src="../../assets/pin-mark.svg" width="28" height="32" alt="" />
          <span style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-.02em' }}>Casi<span style={{ color: 'var(--brand)' }}>Llego</span></span>
        </div>
        <div style={{ padding: '0 22px 16px' }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', color: 'rgba(255,255,255,.4)' }}>Tutor</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: 'rgba(255,255,255,.85)', marginTop: 3 }}>Cuenta familiar</div>
        </div>
        <div style={{ flex: 1, padding: '8px 14px', display: 'flex', flexDirection: 'column', gap: 3 }}>
          {TUTOR_NAV.map((n) => {
            const activeNav = view === n.key;
            return (
              <span key={n.key} onClick={() => setView(n.key)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderRadius: 11, fontSize: 15, cursor: 'pointer', background: activeNav ? 'rgba(251,106,69,.20)' : 'transparent', color: activeNav ? '#fff' : 'rgba(255,255,255,.6)', fontWeight: activeNav ? 700 : 600 }}>
                <TIcon name={n.icon} />{n.label}
              </span>
            );
          })}
        </div>
        <div style={{ padding: '16px 18px', borderTop: '1px solid rgba(255,255,255,.08)', display: 'flex', alignItems: 'center', gap: 11 }}>
          <span style={{ width: 36, height: 36, borderRadius: '50%', background: 'rgba(255,255,255,.12)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700 }}>LM</span>
          <span style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.2 }}>
            <span style={{ fontSize: 14, fontWeight: 600 }}>Laura Mora</span>
            <span style={{ fontSize: 12, color: 'rgba(255,255,255,.5)' }}>Tutor</span>
          </span>
        </div>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--surface-sunken)', minWidth: 0 }}>
        <div style={{ height: 68, flexShrink: 0, background: '#fff', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 28px' }}>
          <div style={{ fontSize: 14, color: 'var(--ink-200)', fontWeight: 500 }}>Tutor <span style={{ color: 'var(--ink-50)' }}>/</span> <span style={{ color: 'var(--ink-900)', fontWeight: 700 }}>{labels[view]}</span></div>
          {view === 'hijos' && (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 16px', borderRadius: 11, background: 'var(--brand)', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer', boxShadow: '0 4px 10px var(--brand-shadow)' }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14" /></svg>Agregar alumno
            </span>
          )}
        </div>

        <div style={{ flex: 1, overflow: 'auto', padding: '26px 28px' }}>
          {view === 'hijos' && (
            <div>
              <h1 style={{ margin: 0, fontSize: 28, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Mis hijos</h1>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, margin: '4px 0 22px' }}>{CHILDREN.length} alumnos registrados</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {CHILDREN.map((child) => (
                  <div key={child.id} style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: '22px 24px', boxShadow: 'var(--shadow-xs)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                      <span style={{ width: 58, height: 58, borderRadius: 16, background: child.avBg, color: child.avCol, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, fontWeight: 800, flexShrink: 0 }}>{child.initials}</span>
                      <span style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: 1, minWidth: 0 }}>
                        <span style={{ fontSize: 19, fontWeight: 700, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>{child.name}</span>
                        <span style={{ fontSize: 13, color: 'var(--ink-300)', fontWeight: 500 }}>{child.grado}</span>
                        <span style={{ fontSize: 12, color: 'var(--ink-200)', fontFamily: 'var(--font-mono)', letterSpacing: '.03em', marginTop: 2 }}>Matrícula {child.matricula}</span>
                      </span>
                      <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <span onClick={() => { setActiveChild(child.id); setView('autorizados'); }} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 14px', borderRadius: 10, border: '1px solid var(--border-strong)', color: 'var(--ink-600)', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Tutores autorizados</span>
                        <span onClick={() => { setActiveChild(child.id); setView('asociar'); }} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 14px', borderRadius: 10, border: '1px solid var(--border-strong)', color: 'var(--ink-600)', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Asociar institución</span>
                      </span>
                    </div>
                    <div style={{ height: 1, background: 'var(--border-hairline)', margin: '18px 0 14px' }} />
                    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 10 }}>Instituciones</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {child.institutions.map((inst) => {
                        const m = ASOC_META[inst.status];
                        return (
                          <div key={inst.name} style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '11px 14px', background: 'var(--surface-muted)', borderRadius: 11 }}>
                            <span style={{ width: 34, height: 34, borderRadius: 9, background: '#fff', border: '1px solid var(--border)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-300)', flexShrink: 0 }}>
                              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V8l7-4 7 4v13" /><path d="M9 21v-5h6v5" /></svg>
                            </span>
                            <span style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 1, minWidth: 0 }}>
                              <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-900)' }}>{inst.name}</span>
                              <span style={{ fontSize: 12, color: 'var(--ink-200)' }}>{inst.type}</span>
                            </span>
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '6px 12px', borderRadius: 999, background: m.bg, color: m.col, fontSize: 13, fontWeight: 700 }}>
                              <span style={{ width: 7, height: 7, borderRadius: '50%', background: m.col }} />{m.label}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {(view === 'asociar' || view === 'autorizados') && (
            <div style={{ maxWidth: 840 }}>
              <h1 style={{ margin: '0 0 4px', fontSize: 28, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>{view === 'asociar' ? 'Asociar a institución' : 'Tutores autorizados'}</h1>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, marginBottom: 18 }}>{view === 'asociar' ? 'Se enviará una solicitud al administrador de la institución para su aprobación.' : `Quién más puede recoger a ${active.first}, además de ti.`}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
                <span style={{ fontSize: 13, color: 'var(--ink-200)', fontWeight: 600 }}>Alumno:</span>
                {childTabs.map((c) => (
                  <span key={c.id} onClick={() => setActiveChild(c.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 14px', borderRadius: 999, cursor: 'pointer', background: c.on ? 'var(--ink-900)' : '#fff', color: c.on ? '#fff' : 'var(--ink-600)', border: `1px solid ${c.on ? 'var(--ink-900)' : 'var(--border-strong)'}`, fontSize: 14, fontWeight: 600 }}>
                    <span style={{ width: 22, height: 22, borderRadius: '50%', background: c.avBg, color: c.avCol, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 800 }}>{c.initials}</span>{c.first}
                  </span>
                ))}
              </div>

              {view === 'asociar' && (
                <>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: '#fff', border: '1px solid var(--border-strong)', borderRadius: 12, padding: '13px 16px', marginBottom: 18 }}>
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink-200)" strokeWidth="2"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4-4" /></svg>
                    <span style={{ color: 'var(--ink-200)', fontSize: 15 }}>Buscar institución por nombre o clave</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {SEARCH_RESULTS.map((r) => {
                      const key = activeChild + '::' + r.name;
                      const status = r.base !== 'none' ? r.base : (sent[key] ? 'enviada' : null);
                      return (
                        <div key={r.name} style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 12, padding: '15px 18px', display: 'flex', alignItems: 'center', gap: 15, boxShadow: 'var(--shadow-xs)' }}>
                          <span style={{ width: 42, height: 42, borderRadius: 11, background: 'var(--surface-muted)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-300)', flexShrink: 0 }}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 21h18M5 21V8l7-4 7 4v13" /><path d="M9 21v-5h6v5" /></svg>
                          </span>
                          <span style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                            <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--ink-900)' }}>{r.name}</span>
                            <span style={{ fontSize: 13, color: 'var(--ink-200)' }}>{r.type} · {r.zona}</span>
                          </span>
                          {!status ? (
                            <span onClick={() => setSent((s) => ({ ...s, [key]: true }))} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '10px 16px', borderRadius: 10, background: 'var(--brand)', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Solicitar asociación</span>
                          ) : (
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 15px', borderRadius: 999, background: ASOC_META[status].bg, color: ASOC_META[status].col, fontSize: 13, fontWeight: 700 }}><span style={{ width: 7, height: 7, borderRadius: '50%', background: ASOC_META[status].col }} />{ASOC_META[status].label}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {view === 'autorizados' && (
                <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: '8px 8px', boxShadow: 'var(--shadow-xs)' }}>
                  {active.authorized.map((a, i, arr) => {
                    const m = AUTH_META[a.status];
                    return (
                      <div key={a.name} style={{ display: 'flex', alignItems: 'center', gap: 15, padding: '15px 16px', borderBottom: i === arr.length - 1 ? 'none' : '1px solid var(--border-hairline)' }}>
                        <span style={{ width: 44, height: 44, borderRadius: '50%', background: 'var(--surface-muted)', color: 'var(--ink-600)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, fontWeight: 800, flexShrink: 0 }}>{a.initials}</span>
                        <span style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                          <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--ink-900)' }}>{a.name}</span>
                          <span style={{ fontSize: 13, color: 'var(--ink-300)' }}>{a.rel} · {a.tel}</span>
                        </span>
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '6px 13px', borderRadius: 999, background: m.bg, color: m.col, fontSize: 13, fontWeight: 700 }}><span style={{ width: 7, height: 7, borderRadius: '50%', background: m.col }} />{m.label}</span>
                      </div>
                    );
                  })}
                  <div style={{ padding: '14px 16px' }}>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 16px', borderRadius: 11, border: '1px dashed var(--border-strong)', color: 'var(--brand)', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14" /></svg>Invitar tutor
                    </span>
                  </div>
                </div>
              )}
            </div>
          )}

          {view === 'perfil' && (
            <div style={{ maxWidth: 880 }}>
              <h1 style={{ margin: '0 0 4px', fontSize: 28, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.02em' }}>Perfil</h1>
              <div style={{ fontSize: 15, color: 'var(--ink-300)', fontWeight: 500, marginBottom: 18 }}>Tu cuenta y preferencias de aviso</div>
              <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 16, padding: 24, boxShadow: 'var(--shadow-xs)', display: 'flex', alignItems: 'center', gap: 18 }}>
                <span style={{ width: 64, height: 64, borderRadius: '50%', background: 'var(--brand-soft)', color: 'var(--brand-strong)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, fontWeight: 800, flexShrink: 0 }}>LM</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-.01em' }}>Laura Mora Beltrán</div>
                  <div style={{ fontSize: 14, color: 'var(--ink-300)', fontWeight: 600, marginTop: 5 }}>Tutor · Cuenta familiar · laura.mora@gmail.com</div>
                </div>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 16px', borderRadius: 11, border: '1px solid var(--border-strong)', color: 'var(--ink-600)', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Editar</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 16 }}>
                <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 14, padding: '22px 24px', boxShadow: 'var(--shadow-xs)' }}>
                  <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 12 }}>Mis vehículos</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {[{ name: 'Mazda CX-5 gris', placa: 'ABC-12-34' }, { name: 'VW Jetta blanco', placa: 'NLT-44-21' }].map((v) => (
                      <div key={v.placa} style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '12px 14px', border: '1px solid var(--border-hairline-2)', borderRadius: 12 }}>
                        <span style={{ flex: 1, fontSize: 15, fontWeight: 600, color: 'var(--ink-700)' }}>{v.name}</span>
                        <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-700)', fontFamily: 'var(--font-mono)', background: 'var(--surface-muted)', border: '1px solid var(--border)', padding: '4px 10px', borderRadius: 8 }}>{v.placa}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 14, padding: '22px 24px', boxShadow: 'var(--shadow-xs)' }}>
                  <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-200)', marginBottom: 14 }}>Notificaciones</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                    {['Aprobación de asociación', 'Recordatorio de salida', 'Confirmación de entrega'].map((n) => (
                      <div key={n} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-900)' }}>{n}</span>
                        <span style={{ width: 44, height: 26, borderRadius: 999, background: 'var(--brand)', position: 'relative' }}><span style={{ position: 'absolute', top: 3, left: 21, width: 20, height: 20, borderRadius: '50%', background: '#fff' }} /></span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AppPadre() {
  const [surface, setSurface] = React.useState('movil');
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'center' }}>
      <div style={{ display: 'inline-flex', gap: 4, background: '#fff', border: '1px solid var(--border-strong)', borderRadius: 11, padding: 4, fontFamily: 'var(--font-sans)' }}>
        {[['movil', 'App móvil'], ['web', 'Portal web']].map(([key, label]) => (
          <span key={key} onClick={() => setSurface(key)} style={{ padding: '8px 16px', borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: 'pointer', background: surface === key ? 'var(--ink-900)' : 'transparent', color: surface === key ? '#fff' : 'var(--ink-300)' }}>{label}</span>
        ))}
      </div>
      {surface === 'movil' ? <ParentApp /> : <TutorPortal />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppPadre));
</script>
<script>
(function () {
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
})();
</script>
